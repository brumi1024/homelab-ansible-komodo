---
# Periphery dials the stable public Core endpoint. Core itself stays
# boot-safe on localhost and the private VPS Docker network.
komodo_core_address: "{{ komodo_public_url | regex_replace('^http', 'ws') }}"
# Explicit; the role auto-coerces this when komodo_core_address is set, but
# stating it makes the topology obvious.
komodo_server_enabled: false
