---
# =============================================================================
# KOMODO INVENTORY - SINGLE SOURCE OF TRUTH
# =============================================================================
# All configuration centralized in this file for maximum simplicity

all:
  vars:
    # Network & Connection Settings
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_rsa

    # Komodo Core Settings
    komodo_install_dir: "/opt/komodo"
    komodo_compose_project_name: "komodo-core"
    komodo_port: 9120
    komodo_mongo_cache_size_gb: 0.5
    komodo_core_bind_address: "127.0.0.1"

    # Komodo Periphery Settings (bpbradley.komodo v2.x, outbound connection mode)
    komodo_periphery_port: 8120
    # Track whatever version Core reports on its /version endpoint. Keeps Core/Periphery coupled
    # and makes `make periphery-upgrade` a no-argument way to re-align after a Core bump.
    komodo_periphery_version: "core"
    komodo_user: "komodo"
    komodo_group: "komodo"
    komodo_root_directory: "/etc/komodo"

    # Computed URLs
    komodo_public_url: >-
      {{
        lookup(
          'community.general.onepassword',
          'Komodo',
          field='komodo_host',
          vault='Homelab Ansible'
        )
        | regex_replace('/$', '')
      }}
    komodo_core_http_address: "{{ komodo_public_url }}"
    komodo_core_local_health_url: "http://127.0.0.1:{{ komodo_port }}"

    # Authentication Settings
    komodo_auth_base_url: "{{ komodo_core_http_address }}"
    komodo_auth_admin_username: "{{ lookup('community.general.onepassword', 'Komodo', field='username', vault='Homelab Ansible') }}"
    komodo_auth_admin_password: "{{ lookup('community.general.onepassword', 'Komodo', field='password', vault='Homelab Ansible') }}"
    komodo_auth_service_user: "komodo-automation"
    komodo_auth_service_user_description: "Service user for automated deployments and API access"
    komodo_auth_api_key_name: "deployment-api-key"

    # API Credentials (1Password lookups)
    komodo_core_api_key: "{{ lookup('community.general.onepassword', 'Komodo', field='komodo_api_key', vault='Homelab Ansible') }}"
    komodo_core_api_secret: "{{ lookup('community.general.onepassword', 'Komodo', field='komodo_api_secret', vault='Homelab Ansible') }}"

    # komodo-op Configuration (Secret Management)
    enable_komodo_op: true  # Set to true to enable komodo-op deployment
    # NOTE: komodo-op repository is now defined in komodo-resource-syncs, not here

    # Resource Syncs Configuration (GitOps)
    komodo_resource_syncs_repo: "brumi1024/komodo-resource-syncs"
    komodo_resource_syncs_branch: "main"
    komodo_resource_syncs_git_account: "brumi1024"
    homelab_tailnet: "{{ lookup('community.general.onepassword', 'Network', field='tailnet', vault='Homelab Ansible') }}"

    # Pragmatic security baseline defaults.
    homelab_security_ssh_hardening_enabled: true
    homelab_security_unattended_upgrades_enabled: true
    homelab_security_forbidden_public_tcp_ports: []
    homelab_security_input_firewall_enabled: false
    homelab_security_public_tcp_ports: []
    homelab_security_public_udp_ports: []
    homelab_security_allow_tailscale: true
    homelab_security_tailscale_interface: tailscale0
    homelab_docker_dns_enabled: true
    homelab_docker_dns_servers:
      - "100.100.100.100"
      - "1.1.1.1"
    homelab_docker_dns_search:
      - "{{ homelab_tailnet }}"
    homelab_docker_proxy_firewall_enabled: false
    homelab_docker_proxy_container_port: 2375
    # homelab_docker_proxy_source_ip is discovered at run time from the Core
    # host, because iptables source matching needs a literal address. See
    # playbooks/tasks/discover_core_tailnet_ip.yml.
    homelab_swap_size_mb: 0

    # geerlingguy.security owns the generic Linux hardening. Keep these
    # explicit because the root SSH policy is intentionally less strict than
    # the role default: root key auth stays available for Ansible recovery.
    security_ssh_password_authentication: "no"
    security_ssh_challenge_response_auth: "no"
    security_ssh_x11_forwarding: "no"
    security_ssh_permit_empty_password: "no"
    security_ssh_gss_api_authentication: "no"
    security_ssh_permit_root_login: "prohibit-password"
    security_autoupdate_enabled: "{{ homelab_security_unattended_upgrades_enabled }}"
    security_autoupdate_reboot: "false"
    security_fail2ban_enabled: true


  children:
    # Control machine (not managed by infrastructure playbooks)
    control:
      hosts:
        localhost:
          ansible_connection: local

    # Managed Komodo infrastructure.
    #
    # ansible_host uses MagicDNS short names. Tailscale addresses are only
    # routable through tailscaled, which also serves MagicDNS from its local
    # netmap, so a literal address survives no outage that the name does not.
    # Names also keep SSH host-key trust working for operators, and they carry
    # no 1Password dependency, so `make recovery-check` runs without an unlock.
    komodo:
      children:
        core:
          hosts:
            homelab-vps:
              ansible_host: "homelab-vps"
              node_site: vps
              komodo_role: core

        legacy_core:
          hosts:
            docker:
              ansible_host: "docker"
              node_site: home
              komodo_role: legacy-core

        periphery:
          vars:
            # Periphery dials the stable public Core endpoint. Core itself stays
            # boot-safe on localhost and the private VPS Docker network.
            komodo_core_address: "{{ komodo_public_url | regex_replace('^http', 'ws') }}"
            # Explicit; role auto-coerces this when komodo_core_address is set, but stating
            # it makes the topology obvious.
            komodo_server_enabled: false
          hosts:
            docker:
              ansible_host: "docker"
              node_site: home
              homelab_security_forbidden_public_tcp_ports:
                - 2019   # Caddy admin
                - 27017  # Komodo MongoDB
              homelab_docker_proxy_firewall_enabled: true

            docker-seq:
              ansible_host: "docker-seq"
              node_site: sequoia
              homelab_security_forbidden_public_tcp_ports:
                - 2019   # Caddy admin
                - 32768  # Docker socket proxy, old random publish
              homelab_docker_proxy_firewall_enabled: true

            sequoia-rpi-4:
              ansible_host: "sequoia-rpi-4"
              node_site: sequoia
              # This Raspberry Pi currently uses dropbear, not OpenSSH server.
              homelab_security_ssh_hardening_enabled: false
              homelab_docker_proxy_firewall_enabled: true

            homelab-vps:
              ansible_host: "homelab-vps"
              node_site: vps
              homelab_security_input_firewall_enabled: true
              homelab_security_public_tcp_ports:
                - 80
                - 443
              homelab_security_public_udp_ports:
                - 443
                - 41641
                - 40000
              homelab_swap_size_mb: 2048

    proxmox:
      hosts:
        susanoo:
          ansible_host: "susanoo"
          node_site: home

        eurus:
          ansible_host: "eurus"
          node_site: sequoia
