---
- name: Validate the Komodo Core migration request
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Require explicit migration confirmation
      ansible.builtin.assert:
        that:
          - confirm_komodo_core_migration | default('') == 'MIGRATE'
          - groups['legacy_core'] | length == 1
          - groups['core'] | length == 1
          - groups['legacy_core'][0] != groups['core'][0]
        fail_msg: >-
          Refusing to migrate. Set confirm_komodo_core_migration=MIGRATE and
          configure exactly one distinct legacy_core and core host.

    - name: Create a unique migration identifier
      ansible.builtin.set_fact:
        komodo_migration_id: >-
          {{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}

    - name: Create unique migration archive names
      ansible.builtin.set_fact:
        komodo_migration_archive_name: >-
          komodo-core-{{ komodo_migration_id }}.archive.gz
        komodo_migration_identity_archive_name: >-
          komodo-core-{{ komodo_migration_id }}.identity.tgz

    - name: Create the controller staging directory
      ansible.builtin.file:
        path: /tmp/komodo-core-migration
        state: directory
        mode: "0700"

- name: Quiesce and export the legacy Komodo database
  hosts: legacy_core
  become: true
  gather_facts: false
  any_errors_fatal: true

  vars:
    komodo_migration_archive_name: >-
      {{ hostvars['localhost']['komodo_migration_archive_name'] }}
    komodo_migration_archive_path: >-
      {{ komodo_install_dir }}/{{ komodo_migration_archive_name }}
    komodo_migration_identity_archive_name: >-
      {{ hostvars['localhost']['komodo_migration_identity_archive_name'] }}
    komodo_migration_identity_archive_path: >-
      {{ komodo_install_dir }}/{{ komodo_migration_identity_archive_name }}

  tasks:
    - name: Verify the legacy Compose project is running
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ komodo_compose_project_name }}"
          - --project-directory
          - "{{ komodo_install_dir }}"
          - --env-file
          - "{{ komodo_install_dir }}/compose.env"
          - ps
          - --status
          - running
          - --services
      register: komodo_legacy_services
      changed_when: false

    - name: Require legacy Core and MongoDB services
      ansible.builtin.assert:
        that:
          - "'core' in komodo_legacy_services.stdout_lines"
          - "'mongo' in komodo_legacy_services.stdout_lines"

    - name: Locate the legacy Core identity volume
      ansible.builtin.command:
        argv:
          - docker
          - volume
          - inspect
          - --format
          - "{{ '{{ .Mountpoint }}' }}"
          - "{{ komodo_compose_project_name }}_keys"
      register: komodo_migration_source_key_volume
      changed_when: false

    - name: Verify the legacy Core identity files
      ansible.builtin.stat:
        path: "{{ komodo_migration_source_key_volume.stdout }}/{{ item }}"
      loop:
        - core.key
        - core.pub
      register: komodo_migration_source_key_files

    - name: Require a complete legacy Core identity
      ansible.builtin.assert:
        that:
          - >-
            komodo_migration_source_key_files.results
            | map(attribute='stat.exists')
            | min
        fail_msg: >-
          The legacy Core identity is incomplete. Refusing to migrate because
          Periphery would no longer trust the target Core.

    - name: Export the legacy database in a rollback-protected block
      block:
        - name: Stop legacy Core to quiesce database writes
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - "{{ komodo_compose_project_name }}"
              - --project-directory
              - "{{ komodo_install_dir }}"
              - --env-file
              - "{{ komodo_install_dir }}/compose.env"
              - stop
              - core
          changed_when: true

        - name: Archive the legacy Core identity
          ansible.builtin.command:
            argv:
              - tar
              - --create
              - --gzip
              - --file
              - "{{ komodo_migration_identity_archive_path }}"
              - --directory
              - "{{ komodo_migration_source_key_volume.stdout }}"
              - core.key
              - core.pub
          changed_when: true

        - name: Record the legacy Core public key hash
          ansible.builtin.command:
            argv:
              - sha256sum
              - "{{ komodo_migration_source_key_volume.stdout }}/core.pub"
          register: komodo_migration_source_public_key
          changed_when: false

        - name: Save the legacy Core public key hash
          ansible.builtin.set_fact:
            komodo_migration_source_public_key_hash: >-
              {{ komodo_migration_source_public_key.stdout.split()[0] }}

        - name: Fetch the Core identity archive to the controller
          ansible.builtin.fetch:
            src: "{{ komodo_migration_identity_archive_path }}"
            dest: >-
              /tmp/komodo-core-migration/{{ komodo_migration_identity_archive_name }}
            flat: true

        - name: Export the legacy MongoDB database
          ansible.builtin.shell: >-
            docker compose
            --project-name {{ komodo_compose_project_name | quote }}
            --project-directory {{ komodo_install_dir | quote }}
            --env-file {{ (komodo_install_dir ~ '/compose.env') | quote }}
            exec -T mongo sh -c
            'mongodump --host 127.0.0.1
            --username "$MONGO_INITDB_ROOT_USERNAME"
            --password "$MONGO_INITDB_ROOT_PASSWORD"
            --authenticationDatabase admin
            --db komodo
            --archive --gzip'
            > {{ komodo_migration_archive_path | quote }}
          args:
            executable: /bin/bash
          changed_when: true
          no_log: true

        - name: Fetch the database archive to the controller
          ansible.builtin.fetch:
            src: "{{ komodo_migration_archive_path }}"
            dest: >-
              /tmp/komodo-core-migration/{{ komodo_migration_archive_name }}
            flat: true

      rescue:
        - name: Restart legacy Core after a failed export
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - "{{ komodo_compose_project_name }}"
              - --project-directory
              - "{{ komodo_install_dir }}"
              - --env-file
              - "{{ komodo_install_dir }}/compose.env"
              - start
              - core
          changed_when: true

        - name: Stop after restoring the legacy source
          ansible.builtin.fail:
            msg: >-
              Legacy export failed and Core was restarted. Inspect the source
              before retrying the migration.

- name: Restore and verify Komodo Core on the VPS
  hosts: core
  become: true
  gather_facts: true
  any_errors_fatal: true

  vars:
    komodo_migration_archive_name: >-
      {{ hostvars['localhost']['komodo_migration_archive_name'] }}
    komodo_migration_controller_path: >-
      /tmp/komodo-core-migration/{{ komodo_migration_archive_name }}
    komodo_migration_target_path: >-
      {{ komodo_install_dir }}/{{ komodo_migration_archive_name }}
    komodo_migration_identity_archive_name: >-
      {{ hostvars['localhost']['komodo_migration_identity_archive_name'] }}
    komodo_migration_identity_controller_path: >-
      /tmp/komodo-core-migration/{{ komodo_migration_identity_archive_name }}
    komodo_migration_identity_target_path: >-
      {{ komodo_install_dir }}/{{ komodo_migration_identity_archive_name }}
    komodo_migration_target_identity_backup_path: >-
      {{ komodo_install_dir }}/target-{{ komodo_migration_identity_archive_name }}

  tasks:
    - name: Restore the target in a rollback-protected block
      block:
        - name: Deploy the target Komodo Compose project
          ansible.builtin.include_role:
            name: komodo
          vars:
            komodo_core_network_alias: komodo-core-migrating

        - name: Stop target Core before database restore
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - "{{ komodo_compose_project_name }}"
              - --project-directory
              - "{{ komodo_install_dir }}"
              - --env-file
              - "{{ komodo_install_dir }}/compose.env"
              - stop
              - core
          changed_when: true

        - name: Locate the target Core identity volume
          ansible.builtin.command:
            argv:
              - docker
              - volume
              - inspect
              - --format
              - "{{ '{{ .Mountpoint }}' }}"
              - "{{ komodo_compose_project_name }}_keys"
          register: komodo_migration_target_key_volume
          changed_when: false

        - name: Back up the generated target Core identity
          ansible.builtin.command:
            argv:
              - tar
              - --create
              - --gzip
              - --file
              - "{{ komodo_migration_target_identity_backup_path }}"
              - --directory
              - "{{ komodo_migration_target_key_volume.stdout }}"
              - core.key
              - core.pub
          changed_when: true

        - name: Copy the legacy Core identity to the target
          ansible.builtin.copy:
            src: "{{ komodo_migration_identity_controller_path }}"
            dest: "{{ komodo_migration_identity_target_path }}"
            owner: root
            group: root
            mode: "0600"

        - name: Restore the legacy Core identity on the target
          ansible.builtin.unarchive:
            src: "{{ komodo_migration_identity_target_path }}"
            dest: "{{ komodo_migration_target_key_volume.stdout }}"
            remote_src: true

        - name: Read the restored target Core public key hash
          ansible.builtin.command:
            argv:
              - sha256sum
              - "{{ komodo_migration_target_key_volume.stdout }}/core.pub"
          register: komodo_migration_target_public_key
          changed_when: false

        - name: Require the target to retain the legacy Core identity
          ansible.builtin.assert:
            that:
              - >-
                komodo_migration_target_public_key.stdout.split()[0]
                == hostvars[groups['legacy_core'][0]]
                ['komodo_migration_source_public_key_hash']
            fail_msg: >-
              The restored Core public key does not match the legacy Core.
              Refusing to start the target.

        - name: Copy the migration archive to the target
          ansible.builtin.copy:
            src: "{{ komodo_migration_controller_path }}"
            dest: "{{ komodo_migration_target_path }}"
            owner: root
            group: root
            mode: "0600"

        - name: Restore MongoDB on the target
          ansible.builtin.shell: >-
            docker compose
            --project-name {{ komodo_compose_project_name | quote }}
            --project-directory {{ komodo_install_dir | quote }}
            --env-file {{ (komodo_install_dir ~ '/compose.env') | quote }}
            exec -T mongo sh -c
            'mongorestore --host 127.0.0.1
            --username "$MONGO_INITDB_ROOT_USERNAME"
            --password "$MONGO_INITDB_ROOT_PASSWORD"
            --authenticationDatabase admin
            --drop --archive --gzip'
            < {{ komodo_migration_target_path | quote }}
          args:
            executable: /bin/bash
          register: komodo_migration_restore
          retries: 3
          delay: 5
          until: komodo_migration_restore.rc == 0
          changed_when: true
          no_log: true

        - name: Start target Core
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - "{{ komodo_compose_project_name }}"
              - --project-directory
              - "{{ komodo_install_dir }}"
              - --env-file
              - "{{ komodo_install_dir }}/compose.env"
              - start
              - core
          changed_when: true

        - name: Wait for target Core health
          ansible.builtin.uri:
            url: "{{ komodo_core_local_health_url }}"
            method: GET
            status_code: 200
          register: komodo_migration_target_health
          retries: 30
          delay: 10
          until: komodo_migration_target_health.status == 200

        - name: Persist the verified Core network alias in Compose
          ansible.builtin.template:
            src: >-
              {{ playbook_dir }}/../roles/komodo/templates/komodo-compose.yml.j2
            dest: "{{ komodo_install_dir }}/compose.yml"
            mode: "0644"
          vars:
            komodo_core_network_alias: komodo-core

        - name: Remove the temporary target ingress alias
          ansible.builtin.command:
            argv:
              - docker
              - network
              - disconnect
              - vps-ingress
              - "{{ komodo_compose_project_name }}-core-1"
          changed_when: true

        - name: Publish the verified target Core alias
          ansible.builtin.command:
            argv:
              - docker
              - network
              - connect
              - --alias
              - komodo-core
              - vps-ingress
              - "{{ komodo_compose_project_name }}-core-1"
          changed_when: true

      rescue:
        - name: Stop target Core before restoring its previous identity
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - "{{ komodo_compose_project_name }}"
              - --project-directory
              - "{{ komodo_install_dir }}"
              - --env-file
              - "{{ komodo_install_dir }}/compose.env"
              - stop
              - core
          changed_when: true
          failed_when: false

        - name: Restore the target identity backup after failure
          ansible.builtin.unarchive:
            src: "{{ komodo_migration_target_identity_backup_path }}"
            dest: "{{ komodo_migration_target_key_volume.stdout }}"
            remote_src: true
          when: komodo_migration_target_key_volume is defined
          failed_when: false

        - name: Restart legacy Core after a failed target restore
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - "{{ komodo_compose_project_name }}"
              - --project-directory
              - "{{ komodo_install_dir }}"
              - --env-file
              - "{{ komodo_install_dir }}/compose.env"
              - start
              - core
          delegate_to: "{{ groups['legacy_core'][0] }}"
          changed_when: true

        - name: Stop after restoring the legacy control plane
          ansible.builtin.fail:
            msg: >-
              Target migration failed. Legacy Core was restarted. Inspect the
              target before retrying.

    - name: Report the required ingress cutover
      ansible.builtin.debug:
        msg:
          - "Target Core is healthy at {{ komodo_core_local_health_url }}."
          - "Legacy Core remains stopped and intact for rollback."
          - "Caddy can now select the verified VPS Core. Verify {{ komodo_public_url }}."
          - "Do not remove the legacy volumes until backup and rollback tests pass."

- name: Reconnect Periphery to the migrated Core
  ansible.builtin.import_playbook: 04_komodo_periphery.yml

- name: Verify the migrated control plane
  ansible.builtin.import_playbook: status.yml
  vars:
    komodo_status_api_check: true
