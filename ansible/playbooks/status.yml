---
# Check status of Komodo services
# This playbook replaces hardcoded values in Makefile with proper variables

- name: Check Komodo Core status
  hosts: core
  gather_facts: false
  tasks:
    - name: Check Komodo Core health endpoint
      ansible.builtin.uri:
        url: "{{ komodo_core_local_health_url }}"
        method: GET
        status_code: 200
        timeout: 5
      register: core_health
      failed_when: false

    - name: Display Core status
      ansible.builtin.debug:
        msg: "{{ '✅ Komodo Core is healthy' if core_health.status == 200 else '❌ Komodo Core is not responding' }}"

    - name: Require a healthy Core endpoint
      ansible.builtin.assert:
        that:
          - core_health.status == 200
        fail_msg: "Komodo Core is not responding on its local health endpoint."

    - name: Check Core Docker containers
      ansible.builtin.command: docker ps --filter 'name=komodo-core' --format 'table {{ "{{.Names}}" }}\t{{ "{{.Status}}" }}'
      register: core_containers
      changed_when: false
      failed_when: false

    - name: Display Core containers
      ansible.builtin.debug:
        msg: "{{ core_containers.stdout_lines if core_containers.rc == 0 else 'Could not check Core containers' }}"

- name: Check Komodo Periphery status
  hosts: periphery
  gather_facts: false
  pre_tasks:
    - name: Set runtime variables for parse-time requirements
      ansible.builtin.set_fact:
        _komodo_user: "{{ komodo_user }}"
  tasks:
    - name: Check Periphery systemd service status
      ansible.builtin.systemd:
        name: periphery
        scope: user
      become: true
      become_user: "{{ _komodo_user }}"
      register: periphery_status
      failed_when: false

    - name: Display Periphery status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ '✅ Running' if periphery_status.status.ActiveState == 'active' else '❌ Not running' }}"

    - name: Require the Periphery service to be active
      ansible.builtin.assert:
        that:
          - periphery_status.status.ActiveState == 'active'
        fail_msg: "Periphery is not active on {{ inventory_hostname }}."

    - name: Check Periphery outbound connections
      ansible.builtin.command:
        argv:
          - ss
          - -Htnp
          - state
          - established
      become: true
      register: periphery_connections
      changed_when: false

    - name: Require an active Periphery WebSocket connection
      ansible.builtin.assert:
        that:
          - >-
            periphery_connections.stdout_lines
            | select('search', 'periphery')
            | select('search', ':443')
            | list
            | length > 0
        fail_msg: >-
          Periphery is running on {{ inventory_hostname }}, but it has no live
          WebSocket connection to Komodo Core.

- name: Check the Core view of every Periphery node
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Verify authenticated Komodo server states
      when: komodo_status_api_check | default(false) | bool
      block:
        - name: Query Komodo server states
          ansible.builtin.uri:
            url: "{{ komodo_public_url }}/read"
            method: POST
            headers:
              X-Api-Key: "{{ komodo_core_api_key }}"
              X-Api-Secret: "{{ komodo_core_api_secret }}"
              Content-Type: application/json
            body_format: json
            body:
              type: ListServers
              params: {}
            status_code: 200
            timeout: 10
          register: komodo_server_list
          no_log: true

        - name: Build a safe Komodo server state summary
          ansible.builtin.set_fact:
            komodo_expected_server_records: >-
              {{
                komodo_server_list.json
                | selectattr('name', 'in', groups['periphery'])
                | list
              }}
          no_log: true

        - name: Identify missing and unhealthy Komodo servers
          ansible.builtin.set_fact:
            komodo_missing_servers: >-
              {{
                groups['periphery']
                | difference(
                    komodo_expected_server_records
                    | map(attribute='name')
                    | list
                  )
              }}
            komodo_unhealthy_servers: >-
              {{
                komodo_expected_server_records
                | rejectattr('info.state', 'equalto', 'Ok')
                | map(attribute='name')
                | list
              }}

        - name: Require every Periphery node to be OK in Komodo
          ansible.builtin.assert:
            that:
              - komodo_missing_servers | length == 0
              - komodo_unhealthy_servers | length == 0
            fail_msg: >-
              Komodo does not see every Periphery node as OK.
              Missing: {{ komodo_missing_servers | join(', ') | default('none', true) }}.
              Not OK: {{ komodo_unhealthy_servers | join(', ') | default('none', true) }}.
            success_msg: >-
              Komodo reports all {{ groups['periphery'] | length }} Periphery nodes as OK.

- name: Status Summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display summary
      ansible.builtin.debug:
        msg:
          - "🔍 Komodo Infrastructure Status Check Complete"
          - ""
          - "Core servers: {{ groups['core'] | length }}"
          - "Periphery nodes: {{ groups['periphery'] | length }}"
          - ""
          - "For detailed logs:"
          - "  Core: docker logs komodo-core-komodo-1"
          - "  Periphery: sudo -u komodo journalctl --user -u periphery -f"
