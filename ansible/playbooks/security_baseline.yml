---
- name: Apply pragmatic Linux host security baseline
  hosts: komodo
  become: true
  gather_facts: true

  pre_tasks:
    - name: Resolve the Docker proxy source address
      ansible.builtin.include_tasks: tasks/discover_core_tailnet_ip.yml
      when: homelab_docker_proxy_firewall_enabled | bool

  roles:
    - role: geerlingguy.security
      when: homelab_security_ssh_hardening_enabled | bool

  handlers:
    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded
      when: ansible_facts.service_mgr != "unknown"

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart docker
      ansible.builtin.systemd:
        name: docker.service
        state: restarted
      when: ansible_facts.service_mgr != "unknown"

    - name: Restart homelab input firewall
      ansible.builtin.systemd:
        name: homelab-input-firewall.service
        enabled: true
        state: restarted
      when: homelab_security_input_firewall_enabled | bool

    - name: Restart homelab Docker proxy firewall
      ansible.builtin.systemd:
        name: homelab-docker-proxy-firewall.service
        enabled: true
        state: restarted
      when: homelab_docker_proxy_firewall_enabled | bool

  tasks:
    - name: Remove superseded OpenSSH hardening drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-homelab-hardening.conf
        state: absent
      notify: Reload ssh
      when: homelab_security_ssh_hardening_enabled | bool

    - name: Enable unattended security updates on non-OpenSSH Debian hosts
      ansible.builtin.include_role:
        name: geerlingguy.security
        tasks_from: autoupdate-Debian
      when:
        - not homelab_security_ssh_hardening_enabled | bool
        - homelab_security_unattended_upgrades_enabled | bool
        - ansible_facts.os_family == "Debian"

    - name: Configure homelab input firewall script
      ansible.builtin.template:
        src: homelab-input-firewall.sh.j2
        dest: /usr/local/sbin/homelab-input-firewall
        owner: root
        group: root
        mode: "0755"
      notify: Restart homelab input firewall
      when: homelab_security_input_firewall_enabled | bool

    - name: Configure homelab input firewall service
      ansible.builtin.template:
        src: homelab-input-firewall.service.j2
        dest: /etc/systemd/system/homelab-input-firewall.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart homelab input firewall
      when: homelab_security_input_firewall_enabled | bool

    - name: Configure Docker proxy firewall script
      ansible.builtin.template:
        src: homelab-docker-proxy-firewall.sh.j2
        dest: /usr/local/sbin/homelab-docker-proxy-firewall
        owner: root
        group: root
        mode: "0755"
      notify: Restart homelab Docker proxy firewall
      when: homelab_docker_proxy_firewall_enabled | bool

    - name: Configure Docker proxy firewall service
      ansible.builtin.template:
        src: homelab-docker-proxy-firewall.service.j2
        dest: /etc/systemd/system/homelab-docker-proxy-firewall.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart homelab Docker proxy firewall
      when: homelab_docker_proxy_firewall_enabled | bool

    - name: Check Docker daemon configuration file
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: homelab_docker_daemon_config_stat
      when: homelab_docker_dns_enabled | bool

    - name: Read Docker daemon configuration
      ansible.builtin.slurp:
        path: /etc/docker/daemon.json
      register: homelab_docker_daemon_config_raw
      when:
        - homelab_docker_dns_enabled | bool
        - homelab_docker_daemon_config_stat.stat.exists

    - name: Parse Docker daemon configuration
      ansible.builtin.set_fact:
        homelab_docker_daemon_config: >-
          {{
            (
              homelab_docker_daemon_config_raw.content
              | b64decode
              | from_json
            )
            if homelab_docker_daemon_config_stat.stat.exists
            else {}
          }}
      when: homelab_docker_dns_enabled | bool

    - name: Configure Docker daemon DNS defaults
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {{
            homelab_docker_daemon_config
            | combine(
                {
                  'dns': homelab_docker_dns_servers,
                  'dns-search': homelab_docker_dns_search
                },
                recursive=True
              )
            | to_nice_json
          }}
      notify: Restart docker
      when: homelab_docker_dns_enabled | bool
