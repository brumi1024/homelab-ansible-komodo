---
- name: Check restart and recovery prerequisites
  hosts: komodo
  become: true
  gather_facts: false

  tasks:
    - name: Check Docker service state
      ansible.builtin.systemd:
        name: docker.service
      register: homelab_recovery_docker
      changed_when: false

    - name: Check Tailscale service state
      ansible.builtin.systemd:
        name: tailscaled.service
      register: homelab_recovery_tailscale
      changed_when: false
      failed_when: false

    - name: Check failed system services  # noqa command-instead-of-module
      ansible.builtin.command: systemctl --failed --no-legend
      register: homelab_recovery_failed_units
      changed_when: false
      failed_when: false

    - name: Check unhealthy containers
      ansible.builtin.shell: >-
        docker ps --filter health=unhealthy
        --format '{{ "{{.Names}}" }}'
      register: homelab_recovery_unhealthy_containers
      changed_when: false

    - name: Assert the restart baseline
      ansible.builtin.assert:
        that:
          - homelab_recovery_docker.status.ActiveState == 'active'
          - >-
            homelab_recovery_tailscale is failed
            or homelab_recovery_tailscale.status.ActiveState == 'active'
          - homelab_recovery_failed_units.stdout_lines | length == 0
          - homelab_recovery_unhealthy_containers.stdout_lines | length == 0
        fail_msg: >-
          {{ inventory_hostname }} is not restart-clean. Review failed units,
          Tailscale, Docker, and unhealthy containers above.

- name: Check local Komodo Core health
  hosts: core
  gather_facts: false

  tasks:
    - name: Require the local Core endpoint
      ansible.builtin.uri:
        url: "{{ komodo_core_local_health_url }}"
        method: GET
        status_code: 200
        timeout: 5
