---
- name: Check Linux host security baseline
  hosts: komodo
  become: true
  gather_facts: false

  pre_tasks:
    - name: Resolve the Docker proxy source address
      ansible.builtin.include_tasks: tasks/discover_core_tailnet_ip.yml
      when: homelab_docker_proxy_firewall_enabled | bool

  tasks:
    - name: Read effective OpenSSH server configuration
      ansible.builtin.command: sshd -T
      register: homelab_security_sshd
      changed_when: false
      failed_when: false

    - name: Verify OpenSSH password and X11 hardening
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in homelab_security_sshd.stdout"
          - "'x11forwarding no' in homelab_security_sshd.stdout"
          - "'permitrootlogin yes' not in homelab_security_sshd.stdout"
        fail_msg: >-
          {{ inventory_hostname }} OpenSSH is not hardened. Expected password
          auth disabled, X11 forwarding disabled, and root limited to key-only
          or disabled.
      when:
        - homelab_security_ssh_hardening_enabled | bool
        - homelab_security_sshd.rc == 0
      ignore_errors: true
      register: homelab_security_sshd_assert

    - name: List listening TCP sockets
      ansible.builtin.command: ss -ltnH
      register: homelab_security_tcp_listeners
      changed_when: false

    - name: Verify forbidden ports are not bound to all interfaces
      ansible.builtin.assert:
        that:
          - >-
            homelab_security_tcp_listeners.stdout_lines
            | select(
                'search',
                '(^|\\s)(0\\.0\\.0\\.0|\\[::\\]|\\*)'
                ~ ':' ~ item ~ '\\s'
              )
            | list
            | length == 0
        fail_msg: >-
          {{ inventory_hostname }} exposes TCP port {{ item }} on all
          interfaces. Bind it to localhost, the Tailnet IP, or remove the
          publish.
      loop: "{{ homelab_security_forbidden_public_tcp_ports }}"
      ignore_errors: true
      register: homelab_security_port_assert

    - name: Verify fail2ban unit is active on hardened OpenSSH hosts
      ansible.builtin.systemd:
        name: fail2ban.service
      register: homelab_security_fail2ban_state
      changed_when: false
      when:
        - homelab_security_ssh_hardening_enabled | bool
        - security_fail2ban_enabled | bool

    - name: Assert fail2ban unit is active
      ansible.builtin.assert:
        that:
          - >-
            homelab_security_fail2ban_state.status.ActiveState
            == "active"
        fail_msg: >-
          {{ inventory_hostname }} fail2ban.service is not active.
      when:
        - homelab_security_ssh_hardening_enabled | bool
        - security_fail2ban_enabled | bool
      ignore_errors: true
      register: homelab_security_fail2ban_assert

    - name: Verify VPS input firewall unit is active
      ansible.builtin.systemd:
        name: homelab-input-firewall.service
      register: homelab_security_input_firewall_state
      changed_when: false
      when: homelab_security_input_firewall_enabled | bool

    - name: Assert VPS input firewall unit is active
      ansible.builtin.assert:
        that:
          - >-
            homelab_security_input_firewall_state.status.ActiveState
            == "active"
        fail_msg: >-
          {{ inventory_hostname }} homelab-input-firewall.service is not active.
      when: homelab_security_input_firewall_enabled | bool
      ignore_errors: true
      register: homelab_security_firewall_assert

    - name: Verify Docker proxy firewall unit is active
      ansible.builtin.systemd:
        name: homelab-docker-proxy-firewall.service
      register: homelab_docker_proxy_firewall_state
      changed_when: false
      when: homelab_docker_proxy_firewall_enabled | bool

    - name: Read Docker proxy firewall rules
      ansible.builtin.command: iptables -w -S HOMELAB-MONITORING
      register: homelab_docker_proxy_firewall_rules
      changed_when: false
      when: homelab_docker_proxy_firewall_enabled | bool

    - name: Assert Docker proxy is reachable only from the VPS
      ansible.builtin.assert:
        that:
          - >-
            homelab_docker_proxy_firewall_state.status.ActiveState
            == "active"
          - >-
            ('-s ' ~ homelab_docker_proxy_source_ip ~ '/32')
            in homelab_docker_proxy_firewall_rules.stdout
          - >-
            ('--dport ' ~ homelab_docker_proxy_container_port ~ ' -j DROP')
            in homelab_docker_proxy_firewall_rules.stdout
        fail_msg: >-
          {{ inventory_hostname }} does not restrict its Docker proxy to the
          homelab VPS.
      when: homelab_docker_proxy_firewall_enabled | bool
      ignore_errors: true
      register: homelab_docker_proxy_firewall_assert

    - name: Read Docker daemon configuration
      ansible.builtin.slurp:
        path: /etc/docker/daemon.json
      register: homelab_docker_daemon_config_raw
      when: homelab_docker_dns_enabled | bool

    - name: Parse Docker daemon configuration
      ansible.builtin.set_fact:
        homelab_docker_daemon_config: >-
          {{
            homelab_docker_daemon_config_raw.content
            | b64decode
            | from_json
          }}
      when: homelab_docker_dns_enabled | bool

    - name: Verify Docker daemon DNS is deterministic
      ansible.builtin.assert:
        that:
          - >-
            homelab_docker_daemon_config.get('dns', [])
            == homelab_docker_dns_servers
          - >-
            homelab_docker_daemon_config.get('dns-search', [])
            == homelab_docker_dns_search
        fail_msg: >-
          {{ inventory_hostname }} Docker daemon DNS is not pinned to the
          Tailnet resolver. Containers can inherit stale boot-time DNS and
          break MagicDNS/DDNS after host restarts.
      when: homelab_docker_dns_enabled | bool
      ignore_errors: true
      register: homelab_docker_dns_assert

    - name: Fail host when any Linux security assertion failed
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} has one or more security baseline failures.
          Review the failed assertions above.
      when: >-
        (
          homelab_security_sshd_assert is defined
          and homelab_security_sshd_assert is failed
        )
        or (
          homelab_security_port_assert is defined
          and homelab_security_port_assert is failed
        )
        or (
          homelab_security_fail2ban_assert is defined
          and homelab_security_fail2ban_assert is failed
        )
        or (
          homelab_security_firewall_assert is defined
          and homelab_security_firewall_assert is failed
        )
        or (
          homelab_docker_proxy_firewall_assert is defined
          and homelab_docker_proxy_firewall_assert is failed
        )
        or (
          homelab_docker_dns_assert is defined
          and homelab_docker_dns_assert is failed
        )

- name: Check Proxmox security and recovery baseline
  hosts: proxmox
  become: true
  gather_facts: false

  tasks:
    - name: Check Proxmox firewall state
      ansible.builtin.command: pve-firewall status
      register: homelab_security_pve_firewall
      changed_when: false

    - name: Verify Proxmox firewall is enabled and running
      ansible.builtin.assert:
        that:
          - >-
            'Status: enabled/running' in homelab_security_pve_firewall.stdout
        fail_msg: >-
          {{ inventory_hostname }} Proxmox firewall is not enabled/running.

    - name: Check Proxmox storage state
      ansible.builtin.command: pvesm status
      register: homelab_security_pvesm
      changed_when: false

    - name: Verify no Proxmox storage is inactive
      ansible.builtin.assert:
        that:
          - "' inactive ' not in homelab_security_pvesm.stdout"
        fail_msg: "{{ inventory_hostname }} has inactive Proxmox storage."

    - name: List root MFA factors
      ansible.builtin.command: pveum user tfa list root@pam
      register: homelab_security_root_tfa
      changed_when: false

    - name: Verify root has TOTP and WebAuthn
      ansible.builtin.assert:
        that:
          - "'totp:' in homelab_security_root_tfa.stdout"
          - "'webauthn:' in homelab_security_root_tfa.stdout"
        fail_msg: >-
          {{ inventory_hostname }} root@pam is missing TOTP or WebAuthn.
